<!doctype html>
<html>
  <head>
    <title>Colour Config</title>
    <meta charset="UTF-8">
  </head>
  <body>
    <h2>Configurações</h2>
    <form id="config-form">
      <div class="form-group">
        <label for="update_interval">Atualização (segundos):</label>
        <input type="number" id="update_interval" name="update_interval" min="1" value="3">
      </div>
      <div class="form-group">
        <label for="temp_threshold">Threshold Temp:</label>
        <input type="number" id="temp_threshold" name="temp_threshold" min="0" value="30">
      </div>
      <div class="form-group">
        <label for="humidity_threshold">Threshold Umidade:</label>
        <input type="number" id="humidity_threshold" name="humidity_threshold" min="0" value="70">
      </div>
      <button type="submit">Salvar</button>
    </form>
  </body>
</html>
