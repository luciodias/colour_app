{% args title='Configurações', page='config', active='config' %}
{% include '_head.html' title=title, page=page %}
{% include '_nav.html' active=active %}
<main class="container page">
    <header class="page-header">
        <div>
            <p class="eyebrow">Sistema</p>
            <h1>Configurações</h1>
            <p class="muted">Ajustes persistidos em <code>config.json</code> no dispositivo.</p>
        </div>
    </header>

    <form id="configForm" class="card form-grid">
        <label for="interval">Intervalo de medição (s)</label>
        <input type="number" id="interval" name="update_interval" min="1" max="60" step="1" required>

        <label for="temp">Limite de temperatura (°C)</label>
        <input type="number" id="temp" name="temp_threshold" step="1">

        <label for="hum">Limite de humidade (%)</label>
        <input type="number" id="hum" name="humidity_threshold" min="0" max="100" step="1">

        <div class="form-actions">
            <button type="submit" class="btn-primary">Salvar</button>
            <button type="button" id="resetConfig" class="btn-secondary">Resetar</button>
        </div>
        <p id="config-status" class="form-status" role="status" aria-live="polite"></p>
    </form>
</main>
{% include '_tail.html' %}
