[project]
name = "colour-app"
version = "0.1.0"
description = ""
authors = [
    {name = "Lucio Dias",email = "luciodiass@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4"
dependencies = [
    #"microdot (>=2.6.0,<3.0.0)"
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "rich>=15.0.0",
    "ruff>=0.17.1",
    "taskipy>=1.14.1",
    "ty>=0.0.89",
]
esp = [
    "esptool>=5.6.0",
    "mpremote>=1.29.0",
    "mpy-cross>=1.29.0.post2",
]

# PYTEST
[tool.pytest.ini_options]
asyncio_mode = "auto"
norecursedirs = "colour_app/libs"

# COVERAGE
[tool.coverage.run]
parallel = true
omit = [
    "tests/*",
    "colour_app/libs/*",
    "tools/*",
    "env.py"
    ]

[tool.coverage.report]
precision = 0
skip_covered = true
skip_empty = true

# TASKIPY
[tool.taskipy.tasks]
# pre_lint = 'typos'
lint = 'ruff check'
pre_format = 'ruff check --fix'
format = 'ruff format'
#run = 'fastapi dev fast_zero/app.py'
#pre_test = 'task lint'
test = 'pytest -s -x --cov=colour_app -vv'
post_test = 'coverage html'
typecheck = 'ty check'
build = 'uv run python tools/build.py'

[tool.ruff]
line-length = 140
target-version = "py39"
extend-exclude = ["colour_app/libs", "tools/webrepl.py"]
builtins = ["ptr", "ptr8", "ptr16", "ptr32", "uint", "micropython", "const"]

[tool.ruff.lint]
extend-select = [
    "PYI", # flake8-pyi - stub file specific checks
]
ignore = [
    "F401",   # unused import
    "F403",   # import *
    "E402",   # module level import not at top of file - common in test snippets
    "PYI021", # Docstrings should not be included in stubs (but we want them for MicroPython)
    "PYI044", # `from __future__ import annotations` - used in generated stubs
    "PYI048", # Function body must contain exactly one statement - docstrings count
    "PYI011", # Only simple default values allowed for typed arguments - we want actual defaults
    "PYI014", # Only simple default values allowed for arguments - we want actual defaults
    "PYI029", # __str__ and __repr__ are useful in MicroPython stubs
    "UP032",    # Checks for str.format calls that can be replaced with f-strings.
    "BLE001",   # Checks for except clauses that catch all exceptions.
]

[tool.ty.environment]
root = [".", "colour_app"]

[tool.ty.analysis]
allowed-unresolved-imports = [
    "env",
    "esp",
    "machine",
    "micropython",
    "network",
    "requests",
    "usocket",
    "utime",
    "uwebsocket",
    "webrepl",
]

[tool.ty.src]
exclude = ["colour_app/libs"]
